<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

  <div>Example <span>1</span></div>
<!-- span допомагає редактувати саме виділений текст в css, а div робить аналогічно но звеликами кусками коду він більш потрібен для різних заголовків>-->

  <form action="" method="POST"> <!--оброблю дані сторінки з іншої мови робить action-->
    <label>Input your name</label>
    <input type="text" name="username" id="1" placeholder="Enter name" value="Alex" maxlength="10"> <!--disabled-не активне поле,а readonly ну тут кожному зрозуміло, name="username" програмне ім'я та id="1"  унікальний індетифіікар  усе це дляя роботи з javascript>-->

  </form>
</body>
</html>
