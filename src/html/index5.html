<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fifth site</title>
</head>
<body>

  <div>Example <span>1</span></div>
<!-- span допомагає редактувати саме виділений текст в css, а div робить аналогічно но звеликами кусками коду він більш потрібен для різних заголовків>-->

  <form action="" method="POST"> <!--оброблю дані сторінки з іншої мови програмування робить action-->
    <label>Input your name</label>
    <input type="text" name="username" id="1" placeholder="Enter name" value="Alex" maxlength="10"> <!--disabled-не активне поле,а readonly ну тут кожному зрозуміло, name="username" програмне ім'я та id="1"  унікальний індетифіікар  усе це дляя роботи з javascript>-->

    <input type="password"><br><br>
    <input type="email"><br><br>
    <input type="url"><br><br>
    <input type="color"><br><br>
    <input type="date"><br><br>
    <input type="time"><br><br>
    <input type="datetime-local"><br><br>
    <input type="checkbox"><br><br>
    <input type="radio"><br><br>
    <input type="radio" name="male" checked><br><br>
    <input type="radio" name="male"><br><br>
    <input type="file"><br><br>

    <input type="submit" value="Send"><!--Перезавантажує сторінки надсилає данні на сервер в даному випадку не підєднаний>-->
    <input type="button" value="Send"><!--Просто кнопка>-->
      <input type="reset"> <!--При натисканюю усе повертається в початковий старт сайту>-->
  </form>
</body>
</html>
